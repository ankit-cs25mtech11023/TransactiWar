<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    # Enable SSL
    SSLEngine on

    # Point to the certificate and key files we generated
    # The path is /var/www/html/config/... because the entire project directory
    # is mounted at /var/www/html inside the container.
    SSLCertificateFile /var/www/html/config/nginx/ssl/self-signed.crt
    SSLCertificateKeyFile /var/www/html/config/nginx/ssl/self-signed.key

    # Standard directory permissions
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
