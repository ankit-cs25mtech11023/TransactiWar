<VirtualHost *:443>
    ServerName 10.96.0.60
    DocumentRoot /var/www/html

    # Enable SSL
    SSLEngine on

    # Point to the certificate and key files we generated
    # The path is /var/www/html/config/... because the entire project directory
    # is mounted at /var/www/html inside the container.
    SSLCertificateFile /etc/ssl/certs/self-signed.crt
    SSLCertificateKeyFile /etc/ssl/private/self-signed.key

    # ==========================================
    # SECURITY PATCH: Hardened TLS Configuration
    # ==========================================
    # 1. Disable all old, vulnerable protocols (Only allow TLS 1.2 and TLS 1.3)
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    
    # 2. Enforce the server's strong cipher preferences over the client's
    SSLHonorCipherOrder on
    
    # 3. Require Perfect Forward Secrecy (ECDHE) and modern authenticated encryption
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

    # 4. Enforce High-Strength Key Exchange Curve (Fixes Nmap Warning)
    SSLOpenSSLConfCmd Curves secp384r1
    # Standard directory permissions
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
