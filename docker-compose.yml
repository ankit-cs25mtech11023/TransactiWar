services:
  web:
    build: .
    ports:
      - "443:443"
    volumes:
      - secure_uploads:/var/www/uploads
    depends_on:
      - db
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      # Using root for local dev is fine, but we can set a specific user later
    ports:
      - "3306:3306"
    volumes:
      # This ensures your database isn't wiped out when you stop the container
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
  secure_uploads: